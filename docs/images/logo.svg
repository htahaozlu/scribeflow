<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="ScribeFlow logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#7DCEA0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="160" height="160" rx="40" fill="url(#bg)"/>
  <!-- speech (waveform) flowing into text (transcript lines): the whole product in one glyph -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <line x1="48" y1="72" x2="48" y2="108"/>
    <line x1="68" y1="54" x2="68" y2="126"/>
    <line x1="88" y1="66" x2="88" y2="114"/>
  </g>
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.92">
    <line x1="110" y1="72" x2="140" y2="72"/>
    <line x1="110" y1="90" x2="134" y2="90"/>
    <line x1="110" y1="108" x2="140" y2="108"/>
  </g>
</svg>
