# Build + GitHub Release on a SemVer tag. Builds sdist + wheel, validates the
# artifacts with twine, publishes a GitHub Release with auto-generated notes,
# and attaches the distributions. PyPI upload is handled separately by
# publish.yml (triggered when this Release is published).
name: release

on:
  push:
    tags:
      - "v*"

# contents: write is required to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so release notes can diff against prior tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check artifacts
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
