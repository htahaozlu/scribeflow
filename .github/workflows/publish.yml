# Idempotent PyPI publish via OIDC trusted publishing. Triggers directly on a
# SemVer tag push (a release created by the default GITHUB_TOKEN does NOT trigger
# other workflows, so we key off the tag, not the release) and can be run by hand.
# No API token is stored: the `pypi` environment + id-token: write let PyPI verify
# the workflow's OIDC identity. skip-existing makes re-runs safe.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # checkout needs read; a job-level block resets all others to none
      id-token: write  # OIDC trusted publishing — no API token needed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # tolerate "already uploaded" (idempotent re-runs)
