# GitHub auto-generated release notes configuration.
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - wontfix
    authors:
      - dependabot
  categories:
    - title: "🚀 Features"
      labels:
        - enhancement
        - feature
    - title: "🐞 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📚 Documentation"
      labels:
        - documentation
        - docs
    - title: "🔧 CI / Build / Tooling"
      labels:
        - ci
        - build
        - tooling
        - dependencies
    - title: "Other Changes"
      labels:
        - "*"
